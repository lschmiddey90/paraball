# Moneyball Football Manager 2026 - Positional Metrics Configuration

general:
  id_columns:
    - "Player"
    - "Position"
    - "Age"
    - "Transfer Value"
    - "Division"
    - "Based In"

  league_multipliers:
    default: 0.75
    top_leagues:
      # Big 5 European Leagues
      - league: "Premier Division"      # FM names Premier League as Premier Division in some views/exports
        country: "England"
      - league: "Bundesliga"
        country: "Germany"
      - league: "Ligue 1 McDonald's"    # Or "Ligue 1 Uber Eats" / "Ligue 1" depending on database update
        country: "France"
      - league: "Serie A"
        country: "Italy"
      - league: "First Division"       # FM exports Spanish La Liga / First Division as "First Division"
        country: "Spain"
      
      # Other Tier-1 Leagues (From your export list)
      - league: "Premier Division"
        country: "Argentina"
      - league: "First Division"
        country: "Brazil"
      - league: "Eredivisie"
        country: "Netherlands"
      - league: "3. Liga"
        country: "Germany"

positions:
  # Torwart (Goalkeeper)
  GK:
    positions: ["GK"]
    sides: ["C"]
    metrics:
      - "Save Percentage"
      - "Expected Save Percentage"
      - "xGP_perc"
      - "xGP/90"
    metric_groups:
      Shot Stopping & Prevention:
        weight: 1.0
        metrics:
          - "Save Percentage"
          - "xGP_perc"

  # Innenverteidiger (Center Backs)
  CB:
    positions: ["D"]
    sides: ["C"]
    metrics:
      - "Tackles Completed per 90"
      - "Key Tackles per 90"
      - "Interceptions per 90"
      - "Blk/90"
      - "Shts Blckd/90"
      - "Clearances per 90"
      - "Headers Won per 90"
      - "Headers Won Percentage"
      - "Key Headers per 90"
      - "Possession Won per 90"
      - "Possession Lost per 90"
      - "Pass Completion Percentage"
      - "Progressive Passes per 90"
      - "Tackle Completion Percentage"
    metric_groups:
      Ground Defending:
        weight: 1.4
        metrics:
          - "Key Tackles per 90"
          - "Tackle Completion Percentage"
      Aerial Dominance:
        weight: 1.3
        metrics:
          - "Headers Won Percentage"
          - "Key Headers per 90"
      Anticipation & Protection:
        weight: 1.1
        metrics:
          - "Interceptions per 90"
          - "Blk/90"
          - "Shts Blckd/90"
          - "Possession Won per 90"
      Distribution & Security:
        weight: 0.8
        metrics:
          - "Pass Completion Percentage"
          - "Progressive Passes per 90"
      Pressure Resistance:
        weight: 1.2
        metrics:
          - "Possession Lost per 90"

  WCB:
    positions: ["D"]
    sides: ["C"]
    metrics:
      - "Tackles Completed per 90"
      - "Key Tackles per 90"
      - "Interceptions per 90"
      - "Possession Won per 90"
      - "Clearances per 90"
      - "Blk/90"
      - "Shts Blckd/90"
      - "Headers Won Percentage"
      - "Headers Won per 90"
      - "Key Headers per 90"
      - "Progressive Passes per 90"
      - "Pass Completion Percentage"
      - "Passes Attempted per 90"
      - "Sprints/90"
      - "Dist/90"
      - "Pres A/90"
      - "Possession Lost per 90"
    metric_groups:
      Defensive Ground Actions:
        weight: 1.5
        metrics:
          - "Tackles Completed per 90"
          - "Key Tackles per 90"
          - "Interceptions per 90"
          - "Possession Won per 90"
          - "Blk/90"
          - "Shts Blckd/90"
      Aerial Dominance:
        weight: 1.5
        metrics:
          - "Headers Won Percentage"
          - "Key Headers per 90"
      Ball Progression & Wide Play:
        weight: 1.1
        metrics:
          - "Progressive Passes per 90"
          - "Possession Lost per 90"
      Mobility & Pressing Work Rate:
        weight: 0.6
        metrics:
          - "Sprints/90"
          - "Dist/90"
          - "Pres A/90"

  # Außenverteidiger / Wingbacks (Full Backs / Wing Backs)
  FB_WB:
    positions: ["D", "WB"]
