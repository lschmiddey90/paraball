# Moneyball Football Manager - FM27 Config
# Tactic: balanced mentality, counter-attacking.
#   In possession: more direct passing, higher tempo, pass into space,
#                  dribbling encouraged, more creative freedom.
#   Out of possession: low block, lower defensive line, trigger press much more often.
# MLG is an inverse metric (lower = better).

general:
  id_columns:
    - "Player"
    - "Position"
    - "Age"
    - "Transfer Value"
    - "Division"
    - "Based In"

  league_multipliers:
    default: 0.5
    top_leagues:
      - league: "Premier Division"
        country: "England"
        factor: 1.0
      - league: "Bundesliga"
        country: "Germany"
        factor: 1.0
      - league: "Ligue 1 McDonald's"
        country: "France"
        factor: 0.95
      - league: "Serie A"
        country: "Italy"
        factor: 0.95
      - league: "First Division"
        country: "Spain"
        factor: 1.0
      - league: "Premier Division"
        country: "Argentina"
        factor: 0.85
      - league: "First Division"
        country: "Brazil"
        factor: 0.85
      - league: "Eredivisie"
        country: "Netherlands"
        factor: 0.90
      - league: "Jupiler Pro League"
        country: "Belgium"
        factor: 0.85
      - league: "Bundesliga 2"
        country: "Germany"
        factor: 0.80
      - league: "Premier Division"
        country: "Austria"
        factor: 0.80
      - league: "PKO BP Ekstraklasa"
        country: "Poland"
        factor: 0.80
      - league: "Premier Division"
        country: "Sweden"
        factor: 0.80
      - league: "Superleague"
        country: "Switzerland"
        factor: 0.80
      - league: "J3 League"
        country: "Japan"
        factor: 0.75
      - league: "3. Liga"
        country: "Germany"
        factor: 0.65

  personalities:
    "Model Citizen": 1.00
    "Model Professional": 0.98
    "Perfectionist": 0.95
    "Professional": 0.92
    "Resolute": 0.90
    "Driven": 0.88
    "Iron Willed": 0.85
    "Born Leader": 0.82
    "Charismatic Leader": 0.82
    "Resilient": 0.80
    "Determined": 0.78
    "Fairly Professional": 0.75
    "Spirited": 0.72
    "Very Ambitious": 0.70
    "Ambitious": 0.68
    "Level-Headed": 0.65
    "Light-Hearted": 0.62
    "Jovial": 0.60
    "Leader": 0.58
    "Fairly Determined": 0.55
    "Fairly Ambitious": 0.52
    "Balanced": 0.50
    "Devoted": 0.48
    "Very Loyal": 0.46
    "Loyal": 0.44
    "Fairly Loyal": 0.42
    "Honest": 0.40
    "Sporting": 0.40
    "Fairly Sporting": 0.38
    "Media-Friendly": 0.35
    "Evasive": 0.35
    "Reserved": 0.35
    "Mercenary": 0.28
    "Fickle": 0.25
    "Unambitious": 0.22
    "Unsporting": 0.20
    "Volatile": 0.18
    "Short-Tempered": 0.15
    "Low Determination": 0.12
    "Temperamental": 0.10
    "Low Self-Belief": 0.08
    "Spineless": 0.05
    "Casual": 0.02
    "Slack": 0.00

positions:
  # Goalkeeper
  GK:
    positions: ["GK"]
    sides: ["C"]
    metrics:
      - "Sv %"
      - "xGP/90"
      - "Svh"
      - "Svt"
      - "Svp"
      - "Pas %"
      - "MLG"
    metric_groups:
      Shot_Stopping:
        weight: 1.5
        metrics:
          - "xGP/90"
          - "Sv %"
      Handling:
        weight: 1.1
        metrics:
          - "Svh"
      Distribution:
        weight: 1.0
        metrics:
          - "Pas %"
      Reliability: # Ensure MLG is inverted in your scoring script
        weight: 1.2
        metrics:
          - "MLG"

  # Inverted Full-Back (IP) / Holding Full-Back (OOP)
  # IP: tucks into midfield, keeps the ball moving forward quickly.
  # OOP: stays home in the low block, defends the flank 1v1 and the back post.
  IFB:
    positions: ["D", "WB"]
    sides: ["L", "R"]
    metrics:
      - "Tck/90"
      - "K Tck/90"
      - "Int/90"
      - "Def Act"
      - "Shts Blckd/90"
      - "Hdrs W/90"
      - "Hdr %"
      - "Clr/90"
      - "Pr passes/90"
      - "Ps A/90"
      - "Pas %"
      - "Possession"
      - "Pres C/90"
      - "Pres C"
      - "MLG"
    metric_groups:
      Flank_Defending:
        weight: 1.5
        metrics:
          - "Tck/90"
          - "K Tck/90"
          - "Int/90"
          - "Def Act"
          - "Shts Blckd/90"
      Back_Post_And_Box:
        weight: 1.0
        metrics:
          - "Hdrs W/90"
          - "Hdr %"
          - "Clr/90"
      Inverted_Build_Up:
        weight: 1.3
        metrics:
          - "Pr passes/90"
          - "Ps A/90"
          - "Pas %"
          - "Possession"
      Pressing_Triggers:
        weight: 0.9
        metrics:
          - "Pres C/90"
          - "Pres C"
      Reliability:
        weight: 0.7
        metrics:
          - "MLG"

  # Advanced Centre-Back (IP) / Covering Centre-Back (OOP)
  # IP: steps out of the back line, carries and plays direct progressive passes.
  # OOP: drops off and covers in a deep line - reading play, blocking, clearing, winning headers.
  ADV_DEF:
    positions: ["D"]
    sides: ["C"]
    metrics:
      - "Int/90"
      - "Clr/90"
      - "Shts Blckd/90"
      - "Def Act"
      - "Hdrs W/90"
      - "Hdr %"
      - "K Hdrs/90"
      - "Pr passes/90"
      - "Drb/90"
      - "Ps A/90"
      - "Pas %"
      - "Possession"
      - "MLG"
    metric_groups:
      Covering_And_Box_Defending:
        weight: 1.5
        metrics:
          - "Int/90"
          - "Clr/90"
          - "Shts Blckd/90"
          - "Def Act"
      Aerial_Dominance:
        weight: 1.3
        metrics:
          - "Hdrs W/90"
          - "Hdr %"
          - "K Hdrs/90"
      Advanced_Progression:
        weight: 1.1
        metrics:
          - "Pr passes/90"
          - "Drb/90"
          - "Ps A/90"
          - "Pas %"
      Reliability:
        weight: 0.8
        metrics:
          - "MLG"

  # Defensive Midfielder (IP) / Stopping Wide Centre-Back (OOP)
  # IP: screens and distributes - first, direct pass to launch counters.
  # OOP: drops into the back line as a wide CB and steps out aggressively to engage.
  DM:
    positions: ["DM", "M"]
    sides: ["C"]
    metrics:
      - "Tck/90"
      - "K Tck/90"
      - "Int/90"
      - "Def Act"
      - "Poss Won/90"
      - "Hdrs W/90"
      - "Hdr %"
      - "Clr/90"
      - "Shts Blckd/90"
      - "Pr passes/90"
      - "Ps A/90"
      - "Pas %"
      - "Possession"
      - "Pres C/90"
      - "Pres C"
      - "MLG"
    metric_groups:
      Stopping_And_Ball_Winning:
        weight: 1.5
        metrics:
          - "Tck/90"
          - "K Tck/90"
          - "Int/90"
          - "Def Act"
          - "Poss Won/90"
      Back_Line_Defending:
        weight: 1.1
        metrics:
          - "Hdrs W/90"
          - "Hdr %"
          - "Clr/90"
          - "Shts Blckd/90"
      Direct_Distribution:
        weight: 1.3
        metrics:
          - "Pr passes/90"
          - "Ps A/90"
          - "Pas %"
          - "Possession"
      Pressing_Triggers:
        weight: 1.2
        metrics:
          - "Pres C/90"
          - "Pres C"
      Reliability:
        weight: 0.7
        metrics:
          - "MLG"

  # Channel Midfielder (IP) / Central Midfielder (OOP)
  # IP: attacks the half-space/channels, carries the ball on the counter, creates.
  # OOP: compact in the low block, triggers the press and wins the ball back.
  CHANNEL_MID:
    positions: ["M", "AM"]
    sides: ["C"]
    metrics:
      - "xA/90"
      - "OP-KP/90"
      - "Ch C/90"
      - "Pr passes/90"
      - "Drb/90"
      - "Sprints/90"
      - "NP-xG/90"
      - "ShT/90"
      - "Pres C/90"
      - "Pres C"
      - "Poss Won/90"
      - "Tck/90"
      - "Int/90"
      - "Dist/90"
    metric_groups:
      Channel_Creation:
        weight: 1.4
        metrics:
          - "xA/90"
          - "OP-KP/90"
          - "Ch C/90"
          - "Pr passes/90"
      Carrying_And_Runs:
        weight: 1.3
        metrics:
          - "Drb/90"
          - "Sprints/90"
          - "NP-xG/90"
      Pressing_And_Ball_Winning:
        weight: 1.3
        metrics:
          - "Pres C/90"
          - "Pres C"
          - "Poss Won/90"
          - "Tck/90"
          - "Int/90"
      Work_Rate:
        weight: 0.6
        metrics:
          - "Dist/90"

  # Winger (IP) / Wide Midfielder (OOP)
  # IP: holds the width, beats players 1v1 and drives counters, delivers into the box.
  # OOP: tracks back into a midfield line of the low block, presses wide triggers.
  WINGER:
    positions: ["AM", "M"]
    sides: ["L", "R"]
    metrics:
      - "Drb/90"
      - "Sprints/90"
      - "xA/90"
      - "OP-Crs A/90"
      - "OP-Cr %"
      - "Ch C/90"
      - "OP-KP/90"
      - "NP-xG/90"
      - "ShT/90"
      - "Pres C/90"
      - "Pres C"
      - "Tck/90"
      - "Int/90"
      - "Poss Won/90"
    metric_groups:
      Dribbling_And_Transition:
        weight: 1.4
        metrics:
          - "Drb/90"
          - "Sprints/90"
      Delivery_And_Creation:
        weight: 1.3
        metrics:
          - "xA/90"
          - "OP-Crs A/90"
          - "OP-Cr %"
          - "Ch C/90"
          - "OP-KP/90"
      Goal_Threat:
        weight: 1.0
        metrics:
          - "NP-xG/90"
          - "ShT/90"
      Defensive_Work:
        weight: 1.0
        metrics:
          - "Pres C/90"
          - "Pres C"
          - "Tck/90"
          - "Int/90"
          - "Poss Won/90"

  # Deep-Lying Forward (IP) / Central Outlet Centre-Forward (OOP)
  # IP: drops into pockets to link play and release runners, still a goal threat.
  # OOP: stays high as the counter outlet - holds up, wins headers, runs in behind.
  #      (little defensive work expected, so no pressing group)
  DLF:
    positions: ["ST", "AM"]
    sides: ["C"]
    metrics:
      - "xA/90"
      - "Ch C/90"
      - "OP-KP/90"
      - "Pr passes/90"
      - "Pas %"
      - "NP-xG/90"
      - "ShT/90"
      - "Conv %"
      - "xG-OP"
      - "Aer A/90"
      - "Hdrs W/90"
      - "Hdr %"
      - "Drb/90"
      - "Sprints/90"
    metric_groups:
      Link_Up_And_Creation:
        weight: 1.4
        metrics:
          - "xA/90"
          - "Ch C/90"
          - "OP-KP/90"
          - "Pr passes/90"
          - "Pas %"
      Goal_Threat:
        weight: 1.4
        metrics:
          - "NP-xG/90"
          - "xG-OP"
          - "ShT/90"
          - "Conv %"
      Counter_Outlet:
        weight: 1.3
        metrics:
          - "Aer A/90"
          - "Hdrs W/90"
          - "Hdr %"
          - "Drb/90"
          - "Sprints/90"
