  id_columns:
    - "Player"
    - "Position"
    - "Age"
    - "Transfer Value"
    - "Division"
    - "Based In"

  league_multipliers:
    default: 0.5
    top_leagues:
      - league: "Premier Division"
        country: "England"
        factor: 1.0
      - league: "Bundesliga"
        country: "Germany"
        factor: 1.0
      - league: "Ligue 1 McDonald's"
        country: "France"
        factor: 0.95
      - league: "Serie A"
        country: "Italy"
        factor: 0.95
      - league: "First Division"
        country: "Spain"
        factor: 1.0
      - league: "Premier Division"
        country: "Argentina"
        factor: 0.85
      - league: "First Division"
        country: "Brazil"
        factor: 0.85
      - league: "Eredivisie"
        country: "Netherlands"
        factor: 0.90
      - league: "Jupiler Pro League"
        country: "Belgium"
        factor: 0.85
      - league: "Bundesliga 2"
        country: "Germany"
        factor: 0.80
      - league: "Premier Division"
        country: "Austria"
        factor: 0.80
      - league: "PKO BP Ekstraklasa"
        country: "Poland"
        factor: 0.80
      - league: "Premier Division"
        country: "Sweden"
        factor: 0.80
      - league: "Superleague"
        country: "Switzerland"
        factor: 0.80
      - league: "J3 League"
        country: "Japan"
        factor: 0.75
      - league: "3. Liga"
        country: "Germany"
        factor: 0.65

  personalities:
    "Model Citizen": 1.00
    "Model Professional": 0.98
    "Perfectionist": 0.95
    "Professional": 0.92
    "Resolute": 0.90
    "Driven": 0.88
    "Iron Willed": 0.85
    "Born Leader": 0.82
    "Charismatic Leader": 0.82
    "Resilient": 0.80
    "Determined": 0.78
    "Fairly Professional": 0.75
    "Spirited": 0.72
    "Very Ambitious": 0.70
    "Ambitious": 0.68
    "Level-Headed": 0.65
    "Light-Hearted": 0.62
    "Jovial": 0.60
    "Leader": 0.58
    "Fairly Determined": 0.55
    "Fairly Ambitious": 0.52
    "Balanced": 0.50
    "Devoted": 0.48
    "Very Loyal": 0.46
    "Loyal": 0.44
    "Fairly Loyal": 0.42
    "Honest": 0.40
    "Sporting": 0.40
    "Fairly Sporting": 0.38
    "Media-Friendly": 0.35
    "Evasive": 0.35
    "Reserved": 0.35
    "Mercenary": 0.28
    "Fickle": 0.25
    "Unambitious": 0.22
    "Unsporting": 0.20
    "Volatile": 0.18
    "Short-Tempered": 0.15
    "Low Determination": 0.12
    "Temperamental": 0.10
    "Low Self-Belief": 0.08
    "Spineless": 0.05
    "Casual": 0.02
    "Slack": 0.00

positions:
  # Goalkeeper
  GK:
    positions: ["GK"]
    sides: ["C"]
    metrics:
      - "Sv %"
      - "xGP/90"
      - "Svh"
      - "Svt"
      - "Svp"
      - "Pas %"
      - "MLG"
    metric_groups:
      Shot_Stopping:
        weight: 1.5
        metrics:
          - "xGP/90"
          - "Sv %"
      Handling:
        weight: 1.1
        metrics:
          - "Svh"
      Distribution:
        weight: 1.0
        metrics:
          - "Pas %"
      Reliability: # Ensure MLG is inverted in your scoring script
        weight: 1.2
        metrics:
          - "MLG"

  # Inverted Full-Backs (Tuck in to form a back 3; prioritize overall defensive volume, retention & reliability)
  IFB:
    positions: ["D", "WB"]
    sides: ["L", "R"]
    metrics:
      - "Def Act"
      - "Possession"
      - "MLG"
      - "Int/90"
      - "Tck/90"
      - "K Tck/90"
      - "Aer A/90"
      - "Hdr %"
      - "Pr passes/90"
      - "Pas %"
      - "Ps A/90"
    metric_groups:
      Defending:
        weight: 1.5
        metrics:
          - "Def Act"
          - "Int/90"
          - "Tck/90"
          - "K Tck/90"
      Ball_Security_And_Build_Up:
        weight: 1.4
        metrics:
          - "Possession"
          - "Pr passes/90"
          - "Pas %"
          - "Ps A/90"
      Reliability: # Ensure MLG is inverted in your scoring script
        weight: 1.3
        metrics:
          - "MLG"

  # Advanced Defender (Central defender stepping into midfield / aggressive ball-playing CB)
  ADV_DEF:
    positions: ["D"]
    sides: ["C"]
    metrics:
      - "Def Act"
      - "Possession"
      - "MLG"
      - "Pr passes/90"
      - "Ps A/90"
      - "Pas %"
      - "Int/90"
      - "Hdr %"
      - "Hdrs W/90"
      - "Clr/90"
      - "Drb/90"
    metric_groups:
      Progression:
        weight: 1.5
        metrics:
          - "Pr passes/90"
          - "Ps A/90"
          - "Pas %"
      Proactive_Defending:
        weight: 1.4
        metrics:
          - "Def Act"
          - "Int/90"
          - "Possession"
      Aerial_And_Box:
        weight: 1.2
        metrics:
          - "Hdr %"
          - "Hdrs W/90"
          - "Clr/90"
      Reliability: # Ensure MLG is inverted in your scoring script
        weight: 1.3
        metrics:
          - "MLG"

  # Defensive Midfielders (Double Pivot: screening, turnover differential, progressive distribution)
  DM:
    positions: ["DM", "M"]
    sides: ["C"]
    metrics:
      - "Def Act"
      - "Possession"
      - "PsP"
      - "Int/90"
      - "Tck/90"
      - "Pres C/90"
      - "Pr passes/90"
      - "Ps A/90"
      - "Pas %"
      - "Drb/90"
      - "Dist/90"
    metric_groups:
      Ball_Winning:
        weight: 1.5
        metrics:
          - "Def Act"
          - "Int/90"
          - "Tck/90"
          - "Pres C/90"
      Possession_And_Distribution:
        weight: 1.5
        metrics:
          - "Possession"
          - "Pr passes/90"
          - "PsP"
          - "Ps A/90"
          - "Pas %"
      Work_Rate_And_Reliability: # Ensure MLG is inverted in your scoring script
        weight: 1.2
        metrics:
          - "Dist/90"

  # Channel Midfielders (Mezzalas / Half-space runners: carrying, half-space creation, pressing)
  CHANNEL_MID:
    positions: ["M", "AM"]
    sides: ["C"]
    metrics:
      - "Pr passes/90"
      - "OP-KP/90"
      - "Ch C/90"
      - "xA/90"
      - "Drb/90"
      - "NP-xG/90"
      - "Pres C/90"
      - "Sprints/90"
      - "Dist/90"
      - "Possession"
    metric_groups:
      Half_Space_Creation:
        weight: 1.4
        metrics:
          - "OP-KP/90"
          - "Ch C/90"
          - "xA/90"
          - "Pr passes/90"
      Ball_Carrying:
        weight: 1.3
        metrics:
          - "Drb/90"
          - "NP-xG/90"
      Pressing_And_Two_Way:
        weight: 1.2
        metrics:
          - "Pres C/90"
          - "Sprints/90"

  # Wingers (Width providers, 1v1 take-ons, crossing & back-post goal threat)
  WINGER:
    positions: ["AM", "M"]
    sides: ["L", "R"]
    metrics:
      - "Drb/90"
      - "OP-Crs A/90"
      - "OP-Cr %"
      - "xA/90"
      - "Ch C/90"
      - "OP-KP/90"
      - "NP-xG/90"
      - "ShT/90"
      - "Sprints/90"
      - "Pres C/90"
    metric_groups:
      Dribbling_And_Width:
        weight: 1.4
        metrics:
          - "Drb/90"
          - "Sprints/90"
      Delivery_And_Creation:
        weight: 1.4
        metrics:
          - "xA/90"
          - "OP-Crs A/90"
          - "OP-Cr %"
          - "Ch C/90"

  # Deep-Lying Forward (Drops into pockets to link play, creates for wingers/mezzalas, finishes)
  DLF:
    positions: ["ST", "AM"]
    sides: ["C"]
    metrics:
      - "xA/90"
      - "Ch C/90"
      - "OP-KP/90"
      - "Pr passes/90"
      - "Pas %"
      - "NP-xG/90"
      - "xG-OP"
      - "ShT/90"
      - "Conv %"
      - "Drb/90"
      - "Hdrs W/90"
      - "Pres C/90"
    metric_groups:
      Link_Up_And_Creation:
        weight: 1.5
        metrics:
          - "xA/90"
          - "Ch C/90"
          - "OP-KP/90"
          - "Pr passes/90"
          - "Pas %"
      Goal_Threat:
        weight: 1.3
        metrics:
          - "NP-xG/90"
          - "xG-OP"
          - "ShT/90"
          - "Conv %"
      Hold_Up_And_Press:
        weight: 1.1
        metrics:
          - "Drb/90"
          - "Hdrs W/90"
          - "Pres C/90"